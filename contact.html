<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me | Osmond Odera</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/css/style.css" />
    <script src="https://use.fontawesome.com/0bd7229511.js"></script>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row mainrow">
        <div class="col-sm-3 r1col1">
          <p class="name"><span class="fletter">O</span>smond</p>
          <ul>
            <li><a href="index.html"><i class="fa fa-home"></i> Home</a></li>
            <li><a href="about.html"><i class="fa fa-user"></i> About me</a></li>
            <li><a href="education.html"><i class="fa fa-graduation-cap"></i> Education</a></li>
            <li><a href="services.html"><i class="fa fa-bars"></i> Services</a></li>
            <li><a class="active" href="contact.html"><i class="fa fa-envelope"></i> Contact me</a></li>
          </ul>
        </div>
        <div class="col-sm-9 r1col2 p-4">
          <h2>Contact Me</h2>
          <form class="mt-3">
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" placeholder="Your name" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="you@example.com" />
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="5" placeholder="Write your message here"></textarea>
            </div>
            <button type="submit" class="btn btn-danger">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
